    <script>
        const gallery = document.getElementById('gallery');
        const loading = document.getElementById('loading');
        
        // 多代理降级机制，谁不超时用谁
        const proxies = [
            'https://api.codetabs.com/v1/proxy/?quest=',
            'https://api.allorigins.win/raw?url=',
            'https://corsproxy.io/?url=' 
        ];

        // 封装一个带超时和自动降级的 fetch 函数
        async function fetchWithProxies(targetUrl) {
            for (let i = 0; i < proxies.length; i++) {
                const proxy = proxies[i];
                // allorigins 和 corsproxy 需要编码，codetabs 不需要
                const fetchUrl = proxy.includes('allorigins') ? proxy + encodeURIComponent(targetUrl) : proxy + targetUrl;
                
                try {
                    // 设置 5 秒超时，超时直接抛错进下一个代理
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);
                    
                    const res = await fetch(fetchUrl, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    
                    if (res.ok) return res; // 成功拿到数据，直接返回
                } catch (e) {
                    console.log(`代理 ${proxy} 超时或失败，尝试下一个...`);
                }
            }
            throw new Error('所有代理均请求失败');
        }

        async function loadBing() {
            setActiveBtn(event.target);
            loading.style.display = 'block';
            loading.innerText = '正在拉取必应数据...';
            gallery.innerHTML = '';
            const bingApi = 'https://cn.bing.com/HPImageArchive.aspx?format=js&idx=0&n=10&mkt=zh-CN';
            
            try {
                const res = await fetchWithProxies(bingApi);
                const data = await res.json();
                loading.style.display = 'none';
                
                data.images.forEach(img => {
                    const imgUrl = 'https://cn.bing.com' + img.url;
                    const item = document.createElement('a');
                    item.className = 'item';
                    item.href = imgUrl;
                    item.target = '_blank';
                    item.innerHTML = `
                        <img src="${imgUrl}" loading="lazy" alt="${img.copyright}">
                        <div class="info">${img.copyright}</div>
                    `;
                    gallery.appendChild(item);
                });
            } catch(e) {
                loading.innerText = '必应接口拉取失败，可能是代理被墙了，刷新试试...';
            }
        }

        async function loadWallhaven(tag = '') {
            setActiveBtn(event.target);
            loading.style.display = 'block';
            loading.innerText = '正在拉取 Wallhaven 数据 (可能需要几秒)...';
            gallery.innerHTML = '';
            
            let wallhavenApi = 'https://wallhaven.cc/api/v1/search?categories=100&purity=100&sorting=toplist&topRange=1M&page=1';
            if (tag) wallhavenApi += `&q=${tag}`;

            try {
                const res = await fetchWithProxies(wallhavenApi);
                const data = await res.json();
                loading.style.display = 'none';

                if(data.data && data.data.length > 0) {
                    data.data.forEach(img => {
                        const item = document.createElement('a');
                        item.className = 'item';
                        item.href = img.path;
                        item.target = '_blank';
                        item.innerHTML = `
                            <img src="${img.thumbs.large}" loading="lazy" alt="Wallpaper">
                            <div class="info">分辨率: ${img.resolution} | 点击查看原图</div>
                        `;
                        gallery.appendChild(item);
                    });
                } else {
                    loading.innerText = '没有找到相关壁纸...';
                    loading.style.display = 'block';
                }
            } catch(e) {
                loading.innerText = 'Wallhaven 接口拉取失败，所有代理均超时，请稍后再试...';
            }
        }

        function setActiveBtn(btn) {
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // 初始化默认加载必应
        loadBing();
    </script>
